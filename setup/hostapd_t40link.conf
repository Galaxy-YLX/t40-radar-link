# ---------------------------------------------------------------------------
# hostapd_t40link.conf —— 板卡 ↔ 电脑 的专用无线链路（第二块网卡 MT7612U）
#
# 和雷达的 AP（AR1021x / 5G ch48 / radar_wifi）完全分开：
#   雷达链路 : AR1021x  wlx00037f2044d2  ch48 5240MHz  192.168.8.1/24
#   电脑链路 : MT7612U  wlx24050fb42703  ch6  2437MHz  192.168.9.1/24
#
# 电脑连上后访问 192.168.9.1:46000 就是上位机的数据口。
# ---------------------------------------------------------------------------
interface=CHANGEME
driver=nl80211
country_code=US

ssid=t40_link

# 2.4G ch6：穿墙好、和雷达的 5G 不冲突
hw_mode=g
channel=6
ieee80211n=1
ht_capab=[HT20]

wpa=2
# 部署前改成你自己的密码（电脑侧连 t40_link 时用）
wpa_passphrase=CHANGEME_PASSWORD
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

wmm_enabled=1
macaddr_acl=0
auth_algs=1
ap_max_inactivity=300
