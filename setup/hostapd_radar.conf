ctrl_interface=/run/hostapd_radar
interface=CHANGEME
driver=nl80211
country_code=US

# 雷达只认这个 SSID，且是 open（无密码）网络
ssid=radar_wifi

# 5GHz，channel 48 = 5240MHz (UNII-1, 无 DFS)
hw_mode=a
channel=48

# 雷达侧是 AR1021X，只跑 802.11a，不开 HT
ieee80211n=0

# 多久收不到包就把 STA 踢下线。**必须给大值**：给 5 秒时雷达会被反复踢下线
# 再重连（重连要几十秒，表现就是"点云断断续续"）。实测 600 稳定。
ap_max_inactivity=600

wmm_enabled=1
macaddr_acl=0
auth_algs=1

# 加密全部关闭——和原作者一致，雷达不接受 WPA
#wpa=2
#wpa_passphrase=12345678
#wpa_key_mgmt=WPA-PSK
#rsn_pairwise=CCMP
